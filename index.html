<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clinic Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #eef2f3; --surface: #ffffff; --surface-2: #f5f8f8; --line: #d3dcde;
  --fg: #16262b; --muted: #58696e; --accent: #0d6e78;
  --doc: #1f7a46; --nurse: #5a6872; --physio: #2457b8; --dental: #c2580f;
  --hold-bg: #fff6dc; --hold-line: #ecd48a; --danger: #b42318; --ok-bg: #e4f4ea; --ok-fg: #155a32;
  --font-body: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --font-num: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1719; --surface: #172327; --surface-2: #1d2c31; --line: #2c3f45;
    --fg: #e4eef0; --muted: #98aab0; --accent: #4fb5bf;
    --doc: #3fa56a; --nurse: #7d8c96; --physio: #5b8ae0; --dental: #e07b33;
    --hold-bg: #2c2717; --hold-line: #5a4c22; --danger: #f07065; --ok-bg: #173325; --ok-fg: #8fe0b0;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
}
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .55; cursor: progress; }

.topbar { max-width: 960px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.topbar h1 { font-size: 20px; margin: 0; }
.top-right { display: flex; gap: 12px; align-items: center; }
.status { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-state="live"] .dot { background: var(--doc); }
.status[data-state="error"] .dot { background: var(--danger); }
.link-btn { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 0; }

.tabs { max-width: 960px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.tab { border: 0; background: transparent; color: var(--fg); padding: 10px 14px; border-radius: 7px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.tab .sw { width: 10px; height: 10px; border-radius: 3px; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.tab .count { font-family: var(--font-num); font-size: 12px; background: var(--surface-2); color: var(--muted); border-radius: 99px; padding: 1px 7px; }
.tab.reset { margin-left: auto; color: var(--danger); }

.panel { max-width: 620px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.panel.wide { max-width: 960px; }
.panel h2 { margin: 0; font-size: 22px; }
.panel .sub { margin: -10px 0 0; color: var(--muted); font-size: 14px; }

.issue-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .issue-grid { grid-template-columns: 1fr; } }
.issue { border: 0; color: #fff; border-radius: 9px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 2px; font-weight: 700; font-size: 18px; }
.issue small { font-weight: 400; font-size: 13px; opacity: .9; }
.c-D { background: var(--doc); } .c-N { background: var(--nurse); } .c-PT { background: var(--physio); } .c-Den { background: var(--dental); }

.ticket { background: var(--ok-bg); color: var(--ok-fg); border-radius: 10px; padding: 18px; text-align: center; }
.lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
.ticket .num { font-family: var(--font-num); font-size: 52px; font-weight: 700; line-height: 1.1; }

.trackbar { display: flex; flex-wrap: wrap; gap: 6px; }
.track { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.track[aria-pressed="true"] { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.bar-lbl { align-self: center; font-size: 13px; color: var(--muted); margin-right: 4px; }
.track .count { font-family: var(--font-num); font-weight: 500; margin-left: 4px; }

.waiting { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; }
.waiting-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; align-items: center; }
.chip { font-family: var(--font-num); font-weight: 700; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.chip:first-child { border-color: var(--accent); color: var(--accent); }
.empty { color: var(--muted); font-size: 14px; }

.now { text-align: center; border: 2px dashed var(--line); border-radius: 10px; padding: 14px; }
.now .lbl { color: var(--muted); }
.now .num { font-family: var(--font-num); font-size: 56px; font-weight: 700; line-height: 1.15; }
.now.idle .num { color: var(--muted); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.act { border: 0; border-radius: 9px; padding: 15px; font-weight: 700; font-size: 16px; }
.act.call { background: var(--doc); color: #fff; }
.act.hold { background: var(--dental); color: #fff; }
.act.done { grid-column: 1 / -1; background: var(--fg); color: var(--bg); }

.holds { background: var(--hold-bg); border: 1px solid var(--hold-line); border-radius: 9px; padding: 12px 14px; }
.holds h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.hold-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 1px solid var(--hold-line); }
.hold-row:first-of-type { border-top: 0; }
.hold-row b { font-family: var(--font-num); }
.recall { border: 0; background: var(--physio); color: #fff; border-radius: 6px; padding: 5px 12px; font-size: 14px; font-weight: 600; }

.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.bcell { border-radius: 10px; padding: 16px; color: #fff; display: flex; flex-direction: column; gap: 4px; }
.bcell .room { font-size: 15px; font-weight: 600; }
.bcell .num { font-family: var(--font-num); font-size: 48px; font-weight: 700; line-height: 1.1; }
.bcell .wait { font-size: 13px; opacity: .9; }
.bcell.flash { animation: flash 1.2s ease-out 3; }
@keyframes flash { 50% { filter: brightness(1.35); } }
@media (prefers-reduced-motion: reduce) { .bcell.flash { animation: none; } }

.notice { max-width: 960px; margin: 0 auto 16px; border-radius: 9px; padding: 12px 14px; border: 1px solid var(--hold-line); background: var(--hold-bg); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); }

.login { max-width: 380px; }
.login label { font-weight: 600; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.login input, .modal input { font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--fg); }
.login .err { color: var(--danger); font-size: 14px; margin: 0; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--surface); color: var(--fg); border-radius: 12px; padding: 22px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.modal h3 { margin: 0; color: var(--danger); }
.modal input { font-family: var(--font-num); }
.row { display: flex; gap: 8px; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 8px; padding: 9px 14px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Clinic Queue</h1>
  <div class="top-right">
    <span class="status" id="status" data-state="loading"><span class="dot"></span><span id="status-text">Connecting…</span></span>
    <button class="link-btn" id="signout" hidden>Sign out</button>
  </div>
</div>
<div class="notice" id="notice" hidden></div>

<form class="panel login" id="login" hidden>
  <h2>Staff sign-in</h2>
  <label>Email <input id="email" type="email" autocomplete="username" required></label>
  <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
  <p class="err" id="login-err" hidden></p>
  <button class="btn primary" type="submit" id="login-btn">Sign in</button>
</form>

<div id="app" hidden>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<div class="modal-bg" id="reset-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title">
    <h3 id="reset-title">Reset all queues?</h3>
    <p style="margin:0">This sets every queue back to 001 and clears all waiting, active and on-hold numbers on every station. Type <b>RESET</b> to confirm.</p>
    <input id="reset-input" autocomplete="off" aria-label="Type RESET to confirm">
    <div class="row">
      <button class="btn" id="reset-cancel">Cancel</button>
      <button class="btn danger" id="reset-confirm" disabled>Reset all</button>
    </div>
  </div>
</div>

<script type="module">
// =====================================================================
//  STEP 1: PASTE YOUR FIREBASE CONFIG HERE (from Firebase console →
//  Project settings → Your apps → SDK setup and configuration → Config)
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyCXl5HDmqUs8-hwmaBZmOypgk7DKUjmnPM",
  authDomain: "samwmc-778b2.firebaseapp.com",
  databaseURL: "https://samwmc-778b2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "samwmc-778b2",
  storageBucket: "samwmc-778b2.firebasestorage.app",
  messagingSenderId: "502888458801",
  appId: "1:502888458801:web:d93d0dca2b1d07db320310"
};
// =====================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const SERVICES = {
  D:   { label: 'Doctor Visit',    color: 'c-D' },
  BT:  { label: 'Blood Test',      color: 'c-N' },
  P:   { label: 'Procedure',       color: 'c-N' },
  M:   { label: 'Medical Exam',    color: 'c-N' },
  PT:  { label: 'Physiotherapist', color: 'c-PT' },
  Den: { label: 'Dentist',         color: 'c-Den' },
};
// rooms: how many people can serve this station at the same time. Each device
// picks its room, and every room calls its own next patient from the shared queue.
const STATIONS = {
  D:     { name: 'Doctor',  room: 'Doctor Consultation', tracks: ['D'],            color: 'c-D',   tab: 'doctor', rooms: 3 },
  Nurse: { name: 'Nurse',   room: 'Nurse Station',       tracks: ['BT', 'P', 'M'], color: 'c-N',   tab: 'nurse',  rooms: 3 },
  PT:    { name: 'Physio',  room: 'Physiotherapy',       tracks: ['PT'],           color: 'c-PT',  tab: 'physio', rooms: 3 },
  Den:   { name: 'Dentist', room: 'Dental',              tracks: ['Den'],          color: 'c-Den', tab: 'dental', rooms: 3 },
};
// Room keys are "r1", "r2"... because Firebase turns purely numeric keys into arrays.
const roomIds = (k) => Array.from({ length: STATIONS[k].rooms }, (_, i) => 'r' + (i + 1));
const roomName = (k, r) => STATIONS[k].rooms > 1 ? `${STATIONS[k].room} ${r.slice(1)}` : STATIONS[k].room;
const TABS = [
  { id: 'screener', label: 'Screener' },
  ...Object.entries(STATIONS).map(([k, s]) => ({ id: s.tab, label: s.name, station: k })),
  { id: 'board', label: 'Waiting-room board' },
];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function lsGet(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }
function setStatus(state, text) { $('#status').dataset.state = state; $('#status-text').textContent = text; }
function showNotice(msg) { $('#notice').textContent = msg || ''; $('#notice').hidden = !msg; }

// Firebase drops empty arrays and null values, so fill in the gaps on every read.
function norm(raw) {
  const s = raw || {}, out = { queues: {}, stations: {}, lastIssued: s.lastIssued || null };
  for (const k of Object.keys(SERVICES)) {
    const qq = (s.queues || {})[k] || {};
    out.queues[k] = { nextSeq: qq.nextSeq || 1, waiting: qq.waiting ? Object.values(qq.waiting) : [] };
  }
  for (const k of Object.keys(STATIONS)) {
    const ss = (s.stations || {})[k] || {};
    out.stations[k] = {};
    for (const r of roomIds(k)) {
      const rr = ss[r] || {};
      out.stations[k][r] = { active: rr.active || null, hold: rr.hold ? Object.values(rr.hold) : [] };
    }
  }
  return out;
}

// ---------- view state ----------
const [hashTab, hashRoom] = location.hash.replace('#', '').split('/');
let currentTab = TABS.some(t => t.id === hashTab) ? hashTab : lsGet('cq_tab', 'screener');
if (!TABS.some(t => t.id === currentTab)) currentTab = 'screener';
let nurseTrack = lsGet('cq_nurse_track', 'BT');
// This device's room at each station. A bookmark like #doctor/2 picks room 2.
const myRoom = {};
for (const k of Object.keys(STATIONS)) {
  const fromHash = TABS.find(t => t.id === hashTab)?.station === k && hashRoom ? 'r' + hashRoom : null;
  const r = fromHash || lsGet('cq_room_' + k, 'r1');
  myRoom[k] = roomIds(k).includes(r) ? r : 'r1';
  if (fromHash) lsSet('cq_room_' + k, myRoom[k]);
}
const tabHash = (id) => { const st = TABS.find(t => t.id === id)?.station; return '#' + id + (st ? '/' + myRoom[st].slice(1) : ''); };
let state = norm(null), busy = false, lastIssuedHere = null;
const prevActive = {};

// ---------- setup check ----------
if (firebaseConfig.apiKey.startsWith('PASTE')) {
  setStatus('error', 'Not set up');
  showNotice('Firebase is not configured yet. Open index.html and paste your Firebase config at the top of the script (see README).');
  throw new Error('Firebase config missing');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const stateRef = ref(db, 'state');

// Every change runs as one atomic transaction on the whole queue state, so two
// stations acting at the same moment never overwrite each other.
async function mutate(fn) {
  let result;
  await runTransaction(stateRef, (cur) => { const s = norm(cur); result = fn(s); return s; });
  return result;
}
async function run(action) {
  if (busy) return;
  busy = true; render();
  try { await action(); }
  catch (e) { toast(e && e.code === 'PERMISSION_DENIED' ? 'Not allowed. Sign in again.' : 'Could not save. Check the internet connection and try again.'); console.error(e); }
  finally { busy = false; render(); }
}

// ---------- actions ----------
const issueTicket = (prefix) => run(async () => {
  const t = await mutate((s) => {
    const q = s.queues[prefix];
    const ticket = `${prefix}-${String(q.nextSeq).padStart(3, '0')}`;
    q.waiting.push(ticket); q.nextSeq += 1;
    s.lastIssued = { ticket, label: SERVICES[prefix].label };
    return ticket;
  });
  lastIssuedHere = { ticket: t, label: SERVICES[prefix].label };
});
const callNext = (k) => run(async () => {
  const track = k === 'Nurse' ? nurseTrack : STATIONS[k].tracks[0];
  const r = myRoom[k];
  const t = await mutate((s) => {
    const st = s.stations[k][r];
    if (st.active) return 'busy';
    const next = s.queues[track].waiting.shift();
    if (next) st.active = next;
    return next;
  });
  if (t === 'busy') toast('Press "I have called this number" first.');
  else if (!t) toast('No patients waiting in this queue.');
});
const putOnHold = (k) => run(async () => {
  const r = myRoom[k];
  const ok = await mutate((s) => {
    const st = s.stations[k][r]; if (!st.active) return false;
    st.hold.push(st.active); st.active = null; return true;
  });
  if (!ok) toast('No number is being served right now.');
});
const completeCurrent = (k) => { const r = myRoom[k]; return run(() => mutate((s) => { s.stations[k][r].active = null; })); };
const recallNumber = (k, num) => { const r = myRoom[k]; return run(async () => {
  const ok = await mutate((s) => {
    const st = s.stations[k][r]; if (st.active) return false;
    st.hold = st.hold.filter(n => n !== num); st.active = num; return true;
  });
  if (!ok) toast('Press "I have called this number" first.');
}); };
const resetAll = () => run(async () => {
  await mutate((s) => {
    for (const k of Object.keys(s.queues)) s.queues[k] = { nextSeq: 1, waiting: [] };
    for (const k of Object.keys(s.stations)) for (const r of roomIds(k)) s.stations[k][r] = { active: null, hold: [] };
    s.lastIssued = null;
  });
  lastIssuedHere = null;
  toast('All queues reset to 001.');
});

// ---------- rendering ----------
const waitingFor = (k) => STATIONS[k].tracks.reduce((n, t) => n + state.queues[t].waiting.length, 0);
const dis = () => busy ? 'disabled' : '';

function screenerHTML() {
  const last = lastIssuedHere || state.lastIssued;
  const btn = (k, title) => `<button class="issue ${SERVICES[k].color}" data-issue="${k}" ${dis()}>
    <span>${esc(title)}</span><small>${state.queues[k].waiting.length} waiting · next ${k}-${String(state.queues[k].nextSeq).padStart(3, '0')}</small></button>`;
  return `<section class="panel">
    <h2>Front door screening</h2>
    <p class="sub">Tap the service the patient needs. The number appears on that station's screen straight away.</p>
    <div class="issue-grid">
      ${btn('D', 'Doctor visit')}${btn('BT', 'Nurse: Blood test')}${btn('P', 'Nurse: Procedure')}
      ${btn('M', 'Nurse: Medical exam')}${btn('PT', 'Physiotherapist')}${btn('Den', 'Dentist')}
    </div>
    ${last ? `<div class="ticket" aria-live="polite"><div class="lbl">Ticket issued</div><div class="num">${esc(last.ticket)}</div><div>${esc(last.label)}</div></div>` : ''}
  </section>`;
}

function stationHTML(k) {
  const s = STATIONS[k], cur = state.stations[k][myRoom[k]];
  const track = k === 'Nurse' ? nurseTrack : s.tracks[0];
  const waiting = state.queues[track].waiting;
  const trackBar = k === 'Nurse' ? `<div class="trackbar" role="group" aria-label="Nurse queue">${s.tracks.map(t =>
    `<button class="track" data-track="${t}" aria-pressed="${t === nurseTrack}">${esc(SERVICES[t].label)} (${t})<span class="count">${state.queues[t].waiting.length}</span></button>`).join('')}</div>` : '';
  const roomBar = s.rooms > 1 ? `<div class="trackbar" role="group" aria-label="Which room is this device?"><span class="bar-lbl">This device is</span>${roomIds(k).map(r =>
    `<button class="track" data-room="${r}" data-station="${k}" aria-pressed="${r === myRoom[k]}">Room ${r.slice(1)}<span class="count">${esc(state.stations[k][r].active || '--')}</span></button>`).join('')}</div>` : '';
  const holds = cur.hold.length
    ? cur.hold.map(n => `<div class="hold-row"><b>${esc(n)}</b><button class="recall" data-recall="${esc(n)}" data-station="${k}" ${busy || cur.active ? 'disabled' : ''}>Recall</button></div>`).join('')
    : '<div class="empty">None</div>';
  return `<section class="panel">
    <h2>${esc(roomName(k, myRoom[k]))}</h2>${roomBar}${trackBar}
    <div class="waiting">
      <div class="waiting-head"><span>Next in line${k === 'Nurse' ? ' · ' + esc(SERVICES[track].label) : ''}</span><span>${waiting.length} waiting</span></div>
      <div class="chips">${waiting.length ? waiting.map(n => `<span class="chip">${esc(n)}</span>`).join('') : '<span class="empty">No one waiting</span>'}</div>
    </div>
    <div class="now ${cur.active ? '' : 'idle'}"><div class="lbl">Now serving</div><div class="num">${esc(cur.active || '--')}</div></div>
    <div class="actions">
      <button class="act call" data-call="${k}" ${busy || cur.active ? 'disabled' : ''}>Call next patient</button>
      <button class="act hold" data-hold="${k}" ${dis()}>Put on hold</button>
      <button class="act done" data-done="${k}" ${dis()}>I have called this number</button>
    </div>
    <div class="holds"><h3>On hold</h3>${holds}</div>
  </section>`;
}

function boardHTML() {
  return `<section class="panel wide">
    <h2>Now serving</h2>
    <p class="sub">Show this tab on the waiting-room screen. It updates by itself.</p>
    <div class="board">${Object.entries(STATIONS).map(([k, s]) => {
      // One tile per room that is serving; a station with no one serving still gets one idle tile.
      const busyRooms = roomIds(k).filter(r => state.stations[k][r].active);
      const cell = (r) => `<div class="bcell ${s.color}" data-board="${k}:${r}"><span class="room">${esc(r ? roomName(k, r) : s.room)}</span><span class="num">${esc(r ? state.stations[k][r].active : '--')}</span><span class="wait">${waitingFor(k)} waiting</span></div>`;
      return busyRooms.length ? busyRooms.map(cell).join('') : cell(null);
    }).join('')}
    </div></section>`;
}

function render() {
  $('#tabs').innerHTML = TABS.map(t => {
    const sw = t.station ? `<span class="sw ${STATIONS[t.station].color}"></span>` : '';
    const count = t.station ? `<span class="count">${waitingFor(t.station)}</span>` : '';
    return `<button class="tab" role="tab" aria-selected="${t.id === currentTab}" data-tab="${t.id}">${sw}${esc(t.label)}${count}</button>`;
  }).join('') + `<button class="tab reset" id="open-reset">Reset all</button>`;
  const tab = TABS.find(t => t.id === currentTab);
  $('#main').innerHTML = currentTab === 'screener' ? screenerHTML() : currentTab === 'board' ? boardHTML() : stationHTML(tab.station);
  for (const k of Object.keys(STATIONS)) for (const r of roomIds(k)) {
    const id = k + ':' + r, a = state.stations[k][r].active;
    if (currentTab === 'board' && prevActive[id] !== undefined && prevActive[id] !== a && a) document.querySelector(`[data-board="${id}"]`)?.classList.add('flash');
    prevActive[id] = a;
  }
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { currentTab = b.dataset.tab; lsSet('cq_tab', currentTab); history.replaceState(null, '', tabHash(currentTab)); render(); return; }
  if (b.id === 'open-reset') { $('#reset-input').value = ''; $('#reset-confirm').disabled = true; $('#reset-modal').hidden = false; $('#reset-input').focus(); return; }
  if (b.id === 'reset-cancel') { $('#reset-modal').hidden = true; return; }
  if (b.id === 'reset-confirm') { $('#reset-modal').hidden = true; resetAll(); return; }
  if (b.id === 'signout') { signOut(auth); return; }
  if (b.dataset.issue) return issueTicket(b.dataset.issue);
  if (b.dataset.room) { myRoom[b.dataset.station] = b.dataset.room; lsSet('cq_room_' + b.dataset.station, b.dataset.room); history.replaceState(null, '', tabHash(currentTab)); render(); return; }
  if (b.dataset.track) { nurseTrack = b.dataset.track; lsSet('cq_nurse_track', nurseTrack); render(); return; }
  if (b.dataset.call) return callNext(b.dataset.call);
  if (b.dataset.hold) return putOnHold(b.dataset.hold);
  if (b.dataset.done) return completeCurrent(b.dataset.done);
  if (b.dataset.recall) return recallNumber(b.dataset.station, b.dataset.recall);
});
$('#reset-input').addEventListener('input', (e) => { $('#reset-confirm').disabled = e.target.value.trim() !== 'RESET'; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#reset-modal').hidden = true; });

$('#login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#login-err').hidden = true; $('#login-btn').disabled = true;
  try { await signInWithEmailAndPassword(auth, $('#email').value.trim(), $('#password').value); }
  catch { $('#login-err').textContent = 'Email or password is incorrect.'; $('#login-err').hidden = false; }
  finally { $('#login-btn').disabled = false; }
});

// ---------- connect ----------
let unsub = null;
onAuthStateChanged(auth, (user) => {
  $('#login').hidden = !!user; $('#app').hidden = !user; $('#signout').hidden = !user;
  if (unsub) { unsub(); unsub = null; }
  if (!user) { setStatus('loading', 'Signed out'); return; }
  render();
  unsub = onValue(stateRef, (snap) => { state = norm(snap.val()); if (!busy) render(); },
    () => { setStatus('error', 'No access'); showNotice('This account cannot read the queue. Check the database rules in the README.'); });
});
onValue(ref(db, '.info/connected'), (snap) => {
  if (auth.currentUser) setStatus(snap.val() ? 'live' : 'error', snap.val() ? 'Live' : 'Offline, reconnecting…');
});
</script>
</body>
</html>
